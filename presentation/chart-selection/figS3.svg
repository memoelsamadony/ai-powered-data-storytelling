<text x="72" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25" fill="#0b0b0b" font-weight="bold" text-anchor="start">Compute per selection, from Ollama's own counters</text>
<text x="72" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">Prefill and decode are unaffected by a competing process. These are the honest numbers.</text>
