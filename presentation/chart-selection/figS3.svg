<text x="72" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#898781" font-weight="normal" text-anchor="start">Decode rate: qwen 11.3 tok/s writing 216-247 tokens; gemma 9.3 tok/s writing 153-160. Faster, and wordier, cancel out.</text>
