<text x="608.32" y="775" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#0b0b0b" font-weight="bold" text-anchor="start">63.2 s</text>
<text x="72" y="828" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start">A concurrent run_repeats.py plus its llama-server was resident for the first measurement set. It never touched prefill or decode - it inflated model load and queue</text>
<text x="72" y="850" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start">wait. Any wall clock quoted from a shared machine measures the machine.</text>
