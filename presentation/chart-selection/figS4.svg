<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#898781"/>
</marker>

</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="72" y="76" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#0b0b0b" font-weight="bold" text-anchor="start">Where the smaller-sounding model actually loses: copy, not choice</text>
<text x="72" y="116" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#52514e" font-weight="normal" text-anchor="start">Three titles from one run, each checked against the table the reader would see</text>
<line x1="72" y1="140" x2="1528" y2="140" stroke="#e1e0d9" stroke-width="2"/>
<rect x="72" y="176" width="1456" height="92" rx="10" fill="#fab219" fill-opacity="0.16" stroke="none" stroke-width="0"/>
<text x="96" y="216" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#0b0b0b" font-weight="bold" text-anchor="start">The selector is shown column names, types, ranges and row counts.</text>
<text x="96" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#52514e" font-weight="normal" text-anchor="start">It is never shown a single data value. Every claim in a title is therefore a claim it cannot have checked.</text>
<rect x="72" y="292" width="1456" height="120" rx="10" fill="#0ca30c" fill-opacity="0.06" stroke="none" stroke-width="0"/>
<rect x="72" y="292" width="6" height="120" rx="2" fill="#0ca30c" fill-opacity="1.0" stroke="none" stroke-width="0"/>
<text x="104" y="332" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#0b0b0b" font-weight="normal" text-anchor="start">"High measles cases often coincide with low vaccination coverage"</text>
<text x="104" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" fill="#0ca30c" font-weight="bold" text-anchor="start">Supported, and hedged</text>
<text x="440" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">r = -0.310 across 178 countries in 2023. Weak-to-moderate, and "often" is the right strength of word.</text>
<text x="104" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start">qwen3.5:27b · measles · baseline prompt</text>
<rect x="72" y="428" width="1456" height="120" rx="10" fill="#fab219" fill-opacity="0.06" stroke="none" stroke-width="0"/>
<rect x="72" y="428" width="6" height="120" rx="2" fill="#fab219" fill-opacity="1.0" stroke="none" stroke-width="0"/>
<text x="104" y="468" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#0b0b0b" font-weight="normal" text-anchor="start">"Global measles trends diverge sharply from vaccination rates"</text>
<text x="104" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" fill="#fab219" font-weight="bold" text-anchor="start">True, by luck</text>
<text x="440" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">The indexed figure does diverge: cases fall to 18, coverage rises to 235, both indexed to 100 at 1980.</text>
<text x="104" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start">qwen3.5:27b · measles · baseline prompt</text>
<rect x="72" y="564" width="1456" height="120" rx="10" fill="#d03b3b" fill-opacity="0.06" stroke="none" stroke-width="0"/>
<rect x="72" y="564" width="6" height="120" rx="2" fill="#d03b3b" fill-opacity="1.0" stroke="none" stroke-width="0"/>
<text x="104" y="604" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#0b0b0b" font-weight="normal" text-anchor="start">"Countries with lower vaccination rates report more measles"</text>
<text x="104" y="638" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" fill="#d03b3b" font-weight="bold" text-anchor="start">Overstated</text>
<text x="440" y="638" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">Same r = -0.310, about 10% of the variance, written as a flat statement of fact with no hedge at all.</text>
<text x="104" y="666" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start">qwen3.5:27b · measles · baseline prompt</text>
<rect x="72" y="704" width="1456" height="100" rx="10" fill="#2a78d6" fill-opacity="0.08" stroke="none" stroke-width="0"/>
<text x="100" y="744" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#52514e" font-weight="normal" text-anchor="start">gemma4:31b, same table, same seed: "Measles cases vs vaccination coverage" · "Global trends in measles measures"</text>
<text x="100" y="776" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#0b0b0b" font-weight="bold" text-anchor="start">Duller, and it asserts nothing it has not been given. On a project measuring over-claiming, that is the cheaper failure.</text>
<text x="72" y="828" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start">Correlations computed from the project's own measles frame at 2023, the year those figures slice to. The 2024 slice gives r = -0.165 with n = 180; the sign is stable,</text>
<text x="72" y="850" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start">the strength is not.</text>
</svg>