<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#898781"/>
</marker>

</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="72" y="76" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#0b0b0b" font-weight="bold" text-anchor="start">Chart selection: what is computed, and what is asked</text>
<text x="72" y="116" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#52514e" font-weight="normal" text-anchor="start">backend/storytelling/charts/  ·  2,147 lines of package, 715 lines of test</text>
<line x1="72" y1="140" x2="1528" y2="140" stroke="#e1e0d9" stroke-width="2"/>
<rect x="96" y="210" width="224" height="250" rx="10" fill="#898781" fill-opacity="0.08" stroke="none" stroke-width="0"/>
<rect x="96" y="210" width="224" height="5" rx="2" fill="#898781" fill-opacity="1.0" stroke="none" stroke-width="0"/>
<text x="116" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25" fill="#0b0b0b" font-weight="bold" text-anchor="start">The table</text>
<text x="116" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">column types, read</text>
<text x="116" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">from the data itself:</text>
<text x="116" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">quantitative, temporal,</text>
<text x="116" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">nominal, geo</text>
<text x="116" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#898781" font-weight="bold" text-anchor="start">COMPUTED</text>
<line x1="332" y1="335" x2="380" y2="335" stroke="#898781" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="392" y="210" width="224" height="250" rx="10" fill="#2a78d6" fill-opacity="0.08" stroke="none" stroke-width="0"/>
<rect x="392" y="210" width="224" height="5" rx="2" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="0"/>
<text x="412" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25" fill="#0b0b0b" font-weight="bold" text-anchor="start">Applicability</text>
<text x="412" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">all 17 forms tested</text>
<text x="412" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">against those types;</text>
<text x="412" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">cuts, caps and</text>
<text x="412" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">aggregate drops applied</text>
<text x="412" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#2a78d6" font-weight="bold" text-anchor="start">COMPUTED</text>
<line x1="628" y1="335" x2="676" y2="335" stroke="#898781" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="688" y="210" width="224" height="250" rx="10" fill="#2a78d6" fill-opacity="0.08" stroke="none" stroke-width="0"/>
<rect x="688" y="210" width="224" height="5" rx="2" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="0"/>
<text x="708" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25" fill="#0b0b0b" font-weight="bold" text-anchor="start">14 candidates</text>
<text x="708" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">each already encoded</text>
<text x="708" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">against real columns,</text>
<text x="708" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">already sliced, already</text>
<text x="708" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">carrying its own note</text>
<text x="708" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#2a78d6" font-weight="bold" text-anchor="start">COMPUTED</text>
<line x1="924" y1="335" x2="972" y2="335" stroke="#898781" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="984" y="210" width="224" height="250" rx="10" fill="#eb6834" fill-opacity="0.08" stroke="none" stroke-width="0"/>
<rect x="984" y="210" width="224" height="5" rx="2" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="0"/>
<text x="1004" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25" fill="#0b0b0b" font-weight="bold" text-anchor="start">The model</text>
<text x="1004" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">ranks them, writes the</text>
<text x="1004" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">title, caption and</text>
<text x="1004" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">rationale. It picks an</text>
<text x="1004" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">INDEX, never a form.</text>
<text x="1004" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#eb6834" font-weight="bold" text-anchor="start">ONE CALL</text>
<line x1="1220" y1="335" x2="1268" y2="335" stroke="#898781" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1280" y="210" width="224" height="250" rx="10" fill="#1baf7a" fill-opacity="0.08" stroke="none" stroke-width="0"/>
<rect x="1280" y="210" width="224" height="5" rx="2" fill="#1baf7a" fill-opacity="1.0" stroke="none" stroke-width="0"/>
<text x="1300" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25" fill="#0b0b0b" font-weight="bold" text-anchor="start">Validation</text>
<text x="1300" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">the same rules the</text>
<text x="1300" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">frontend applies,</text>
<text x="1300" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">mirrored server-side;</text>
<text x="1300" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">errors fed back once</text>
<text x="1300" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#1baf7a" font-weight="bold" text-anchor="start">COMPUTED</text>
<rect x="96" y="512" width="1136" height="3" rx="0" fill="#e1e0d9" fill-opacity="1.0" stroke="none" stroke-width="0"/>
<text x="96" y="560" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#2a78d6" font-weight="bold" text-anchor="start">Free and closed</text>
<text x="96" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">Whether a table can carry a bump chart is not a</text>
<text x="96" y="618" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">matter of taste. It follows from the column types,</text>
<text x="96" y="644" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">so it is decided by rules and costs nothing.</text>
<text x="800" y="560" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#eb6834" font-weight="bold" text-anchor="start">Open and editorial</text>
<text x="800" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">Which three of the fourteen are worth a reader's</text>
<text x="800" y="618" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">attention, and how to say why, is the part no rule</text>
<text x="800" y="644" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">table supplies. That is the whole of the model's job.</text>
<rect x="96" y="682" width="1408" height="118" rx="10" fill="#eb6834" fill-opacity="0.09" stroke="none" stroke-width="0"/>
<text x="124" y="722" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#0b0b0b" font-weight="bold" text-anchor="start">Why it is reliable on a 4B model</text>
<text x="124" y="754" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">A model asked to name a chart type can name one the data cannot carry, and nothing downstream catches it. A model</text>
<text x="124" y="780" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">handed a numbered list of already-drawable figures can only be wrong about taste. Across 16 runs: no invalid spec, no retry.</text>
<text x="72" y="828" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start">The candidate count is per table. The WHO tuberculosis upload and the measles registry set both produced exactly 14.</text>
</svg>