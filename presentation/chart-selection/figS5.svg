<text x="124" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#898781" font-weight="normal" text-anchor="start">output</text>
<text x="296" y="368" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">free-form, ~700 tokens</text>
<text x="124" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#898781" font-weight="normal" text-anchor="start">grammar</text>
<text x="296" y="402" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">none</text>
<rect x="124" y="452" width="632" height="118" rx="10" fill="#d03b3b" fill-opacity="0.13" stroke="none" stroke-width="0"/>
<text x="148" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="32" fill="#d03b3b" font-weight="bold" text-anchor="start">Different text</text>
<text x="148" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">after an unload and reload</text>
<rect x="816" y="200" width="688" height="400" rx="10" fill="#0ca30c" fill-opacity="0.07" stroke="none" stroke-width="0"/>
<rect x="816" y="200" width="688" height="5" rx="2" fill="#0ca30c" fill-opacity="1.0" stroke="none" stroke-width="0"/>
<text x="844" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25" fill="#0b0b0b" font-weight="bold" text-anchor="start">This endpoint, measured now</text>
<text x="844" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#898781" font-weight="normal" text-anchor="start">model</text>
<text x="1016" y="300" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">gemma4:31b</text>
<text x="844" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#898781" font-weight="normal" text-anchor="start">temperature</text>
<text x="1016" y="334" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">0</text>
<text x="844" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#898781" font-weight="normal" text-anchor="start">output</text>
<text x="1016" y="368" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">3 picks, ~150 tokens</text>
<text x="844" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#898781" font-weight="normal" text-anchor="start">grammar</text>
<text x="1016" y="402" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start">constrained by schema</text>
<rect x="844" y="452" width="632" height="118" rx="10" fill="#0ca30c" fill-opacity="0.13" stroke="none" stroke-width="0"/>
<text x="868" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="32" fill="#0ca30c" font-weight="bold" text-anchor="start">Byte-identical</text>
<text x="868" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">across two full evictions</text>
<rect x="96" y="632" width="1408" height="150" rx="10" fill="#2a78d6" fill-opacity="0.08" stroke="none" stroke-width="0"/>
<text x="124" y="674" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#0b0b0b" font-weight="bold" text-anchor="start">The two do not contradict each other, and the difference is the point</text>
<text x="124" y="710" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">Seeded reproducibility fails where sampling has room to diverge. Grammar-constrained decoding at temperature 0 over 150 tokens</text>
<text x="124" y="738" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">has almost none, so the chart selector survives a cold load where the story generator does not. Do not carry this back to the story</text>
<text x="124" y="766" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start">stages: they are the condition on the left. One repeat, so this is a qualification, not a new law.</text>
<text x="72" y="828" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start">Verified by diffing two complete run outputs with the timing line removed: 372.0 s and 143.2 s of wall clock, identical bytes, with two qwen3.5:27b loads evicting gemma</text>
<text x="72" y="850" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start">in between.</text>
</svg>