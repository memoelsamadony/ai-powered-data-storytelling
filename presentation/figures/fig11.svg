<text x="1250" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#0b0b0b" font-weight="bold" text-anchor="start" letter-spacing="0">Why two axes</text>
<text x="1250" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">A falling series tempts the opposite</text>
<text x="1250" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">failure. On WHO child mortality the</text>
<text x="1250" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">raw story scored a calm 2.0 alarmism</text>
<text x="1250" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">and a 4.5 optimism: 'nothing short of</text>
<text x="1250" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">miraculous'. One axis sees nothing</text>
<text x="1250" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">there; moderation moved it to 2.5.</text>

<text x="72" y="830" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">Alarmism falls 3.74 -&gt; 2.09 and optimism rises 2.15 -&gt; 2.60, both toward the middle. Note the moderated cloud settles below alarmism 3: the moderator aims at quiet</text>
<text x="72" y="852" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">rather than at calibrated, and lands near where these human writers also sit (diamond).</text>
</svg>