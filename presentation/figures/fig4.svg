<text x="1200" y="377" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" fill="#0b0b0b" font-weight="bold" text-anchor="start" letter-spacing="0">11 of 11 figures supported</text>
<text x="110" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25" fill="#0b0b0b" font-weight="bold" text-anchor="start" letter-spacing="0">pertussis-global</text>
<text x="440" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#52514e" font-weight="normal" text-anchor="end" letter-spacing="0">raw story</text>
<rect x="470" y="474" width="710" height="46" rx="4" fill="#e1e0d9" fill-opacity="0.5"/>
<path d="M 470 474 L 1176.0 474 Q 1180.0 474 1180.0 478 L 1180.0 516 Q 1180.0 520 1176.0 520 L 470 520 Z" fill="#eb6834" fill-opacity="1.0" />
<text x="1200" y="505" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" fill="#0b0b0b" font-weight="bold" text-anchor="start" letter-spacing="0">4 of 4 figures supported</text>
<text x="440" y="576" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#52514e" font-weight="normal" text-anchor="end" letter-spacing="0">after moderation</text>
<rect x="470" y="546" width="710" height="46" rx="4" fill="#e1e0d9" fill-opacity="0.5"/>
<path d="M 470 546 L 1176.0 546 Q 1180.0 546 1180.0 550 L 1180.0 588 Q 1180.0 592 1176.0 592 L 470 592 Z" fill="#2a78d6" fill-opacity="1.0" />
<text x="1200" y="577" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" fill="#0b0b0b" font-weight="bold" text-anchor="start" letter-spacing="0">6 of 6 figures supported</text>
<rect x="110" y="700" width="1380" height="108" rx="10" fill="#0ca30c" fill-opacity="0.07"/>
<text x="136" y="734" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#0ca30c" font-weight="bold" text-anchor="start" letter-spacing="0">The founding anecdote, reproduced as a measurement</text>
<text x="136" y="766" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">The moderated measles story states more numbers than the raw one (11 vs 4) and grounds every single one of them.</text>
<text x="136" y="792" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">The tone agent is quietly doing factual work - and this metric is computed in Python against the evidence pack, no model in the loop.</text>

<text x="72" y="830" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">Replaces the old factsPreserved boolean, which merely restated the fact-checker's verdict. Numeric density rose in both runs (+13.2 and +5.7 per 100 words), the same</text>
<text x="72" y="852" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">finding seen from the text side. n = 2.</text>
</svg>