<path d="M 470 274 L 821.0 274 Q 825.0 274 825.0 278 L 825.0 316 Q 825.0 320 821.0 320 L 470 320 Z" fill="#eb6834" fill-opacity="1.0" />
<text x="1200" y="305" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" fill="#0b0b0b" font-weight="bold" text-anchor="start" letter-spacing="0">2 of 4 figures supported</text>
<text x="1002.5" y="305" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#d03b3b" font-weight="bold" text-anchor="middle" letter-spacing="0">2 unsupported</text>
<text x="440" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#52514e" font-weight="normal" text-anchor="end" letter-spacing="0">after moderation</text>
