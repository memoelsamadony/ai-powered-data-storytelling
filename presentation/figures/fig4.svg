<text x="1180.0" y="656" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#898781" font-weight="normal" text-anchor="middle" letter-spacing="0">100%</text>
<text x="110" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25" fill="#0b0b0b" font-weight="bold" text-anchor="start" letter-spacing="0">measles</text>
<text x="440" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#52514e" font-weight="normal" text-anchor="end" letter-spacing="0">raw story</text>
