<text x="1245" y="292" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#2a78d6" font-weight="bold" text-anchor="start" letter-spacing="1.5">WHAT THIS MEANS</text>
<text x="1245" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">The 2024 paper's headline does</text>
<text x="1245" y="359" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">not reproduce on a modern 12B</text>
<text x="1245" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">model: 18.0% vs &gt; 80%, and 0.23</text>
<text x="1245" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">vs &gt; 2 errors per output.</text>
<text x="1245" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0"></text>
<text x="1245" y="467" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">Modern open models are already</text>
<text x="1245" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="bold" text-anchor="start" letter-spacing="0">fairly faithful — so factual</text>
<text x="1245" y="521" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="bold" text-anchor="start" letter-spacing="0">accuracy is not where the</text>
<text x="1245" y="548" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="bold" text-anchor="start" letter-spacing="0">remaining gap is.</text>
<text x="1528" y="172" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="end" letter-spacing="0">Lower is better ↓   ·   share of outputs containing at least one semantic error</text>
<text x="72" y="830" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">Judge: Claude Opus 4.7 using the paper's own gpt4_metric.yaml prompt. Hatched bar = figure reported in the paper; no metrics CSV in our repository, so it cannot be</text>
<text x="72" y="852" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">re-derived here. Per-domain cells rest on 20 examples each — not readable to better than ±10 points.</text>
