<text x="122" y="728" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">1.  Pick a judge from a different model family than the moderator — today gemma4:31b grades its own rewrite, so every alarmism delta is self-assessed.</text>
<text x="122" y="758" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">2.  Land the human baselines — without a reference, chrF++ and every similarity metric is undefined, and the 1–5 scale has no anchor.</text>

<text x="72" y="830" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">Protocol: EXPERIMENT_PLAN.md plus Addendum A (scale, prompting, time-series metrics). E0 parameters, prompts, hashes, stage timings and full texts are committed in</text>
