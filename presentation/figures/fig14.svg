<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#2a78d6" fill-opacity="0.22"/>
  <line x1="0" y1="0" x2="0" y2="8" stroke="#2a78d6" stroke-width="3"/>
</pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#898781"/>
</marker>
<marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/>
</marker>

</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="72" y="76" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#0b0b0b" font-weight="bold" text-anchor="start" letter-spacing="0">The tone scale now has an error bar</text>
<text x="72" y="116" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">Every story rated three times by Claude Opus, 192 calls, $3.25.</text>
<line x1="72" y1="140" x2="1528" y2="140" stroke="#e1e0d9" stroke-width="2"/>
<rect x="72" y="200" width="330" height="150" fill="#0ca30c" fill-opacity="0.07" rx="8"/>
<text x="96" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">ICC(2,1)</text>
<text x="96" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="52" fill="#0ca30c" font-weight="bold" text-anchor="start" letter-spacing="0">0.991</text>
<text x="96" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">two-way random, absolute agreement</text>
<rect x="442" y="200" width="330" height="150" fill="#0ca30c" fill-opacity="0.07" rx="8"/>
<text x="466" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">Krippendorff alpha</text>
<text x="466" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="52" fill="#0ca30c" font-weight="bold" text-anchor="start" letter-spacing="0">0.991</text>
<text x="466" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">interval scale</text>
<rect x="812" y="200" width="330" height="150" fill="#0ca30c" fill-opacity="0.07" rx="8"/>
<text x="836" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">mean spread</text>
<text x="836" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="52" fill="#0ca30c" font-weight="bold" text-anchor="start" letter-spacing="0">0.08</text>
<text x="836" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">points, over three passes</text>
<rect x="1182" y="200" width="330" height="150" fill="#fab219" fill-opacity="0.07" rx="8"/>
<text x="1206" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">max spread</text>
<text x="1206" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="52" fill="#fab219" font-weight="bold" text-anchor="start" letter-spacing="0">0.5</text>
<text x="1206" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">worst single story</text>
<text x="72" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#0b0b0b" font-weight="bold" text-anchor="start" letter-spacing="0">Agreement across all 64 stories, three independent passes each</text>
<path d="M 72 450 L 1000.75 450 Q 1004.75 450 1004.75 454 L 1004.75 492 Q 1004.75 496 1000.75 496 L 72 496 Z" fill="#0ca30c" fill-opacity="1.0" />
<text x="538.375" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="middle" letter-spacing="0">41</text>
<path d="M 1004.75 450 L 1524.0 450 Q 1528.0 450 1528.0 454 L 1528.0 492 Q 1528.0 496 1524.0 496 L 1004.75 496 Z" fill="#1baf7a" fill-opacity="1.0" />
<text x="1266.375" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="middle" letter-spacing="0">23</text>
<text x="538.375" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#52514e" font-weight="normal" text-anchor="middle" letter-spacing="0">identical on all three</text>
<text x="1266.375" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#52514e" font-weight="normal" text-anchor="middle" letter-spacing="0">within 0.5 of each other</text>
<text x="72" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#0b0b0b" font-weight="bold" text-anchor="start" letter-spacing="0">Why this matters for every other number in the deck</text>
<text x="72" y="634" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">The judge disagrees with itself by 0.08 points on average. The same configuration run at five different</text>
<text x="72" y="662" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">seeds disagrees with itself by 0.42. So the spread in the repeat experiment is the generator resampling,</text>
<text x="72" y="690" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">not the instrument wobbling - which is what makes it worth measuring rather than averaging away.</text>

<text x="72" y="830" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">Same model and same prompt on all three passes, so this is self-consistency, not inter-rater reliability: it is an upper bound on what a different judge would agree to.</text>
<text x="72" y="852" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">Calls are stateless and share no context, which is the only sense in which they are independent.</text>
</svg>