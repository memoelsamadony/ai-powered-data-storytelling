<text x="1186.5217391304348" y="662" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#898781" font-weight="normal" text-anchor="middle" letter-spacing="0">40 GB</text>
<line x1="846.0869565217391" y1="234" x2="846.0869565217391" y2="632" stroke="#d03b3b" stroke-width="2.5" stroke-dasharray="8 5"/>
<line x1="883.9130434782609" y1="234" x2="883.9130434782609" y2="632" stroke="#d03b3b" stroke-width="2.5" stroke-dasharray="8 5"/>
<line x1="1035.2173913043478" y1="234" x2="1035.2173913043478" y2="632" stroke="#898781" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="834.0869565217391" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#d03b3b" font-weight="bold" text-anchor="end" letter-spacing="0">~22 GB usable</text>
<text x="895.9130434782609" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#d03b3b" font-weight="bold" text-anchor="start" letter-spacing="0">24 GB wired GPU limit</text>
<text x="1047.2173913043478" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#898781" font-weight="bold" text-anchor="start" letter-spacing="0">32 GB total RAM</text>
<text x="410" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#0b0b0b" font-weight="bold" text-anchor="end" letter-spacing="0">llama3.1:8b</text>
<text x="410" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#898781" font-weight="normal" text-anchor="end" letter-spacing="0">generator, all tiers</text>
<path d="M 430 286 L 518.6739130434783 286 Q 522.6739130434783 286 522.6739130434783 290 L 522.6739130434783 330 Q 522.6739130434783 334 518.6739130434783 334 L 430 334 Z" fill="#2a78d6" fill-opacity="1.0" />
<text x="540.6739130434783" y="318" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#0b0b0b" font-weight="bold" text-anchor="start" letter-spacing="0">4.9 GB</text>
<text x="410" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#0b0b0b" font-weight="bold" text-anchor="end" letter-spacing="0">gemma4:31b</text>
<text x="410" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#898781" font-weight="normal" text-anchor="end" letter-spacing="0">moderator, judge, fact-checker</text>
<path d="M 430 374 L 802.3695652173913 374 Q 806.3695652173913 374 806.3695652173913 378 L 806.3695652173913 418 Q 806.3695652173913 422 802.3695652173913 422 L 430 422 Z" fill="#eb6834" fill-opacity="1.0" />
<text x="788.3695652173913" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="end" letter-spacing="0">19.9 GB</text>
<text x="410" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#0b0b0b" font-weight="bold" text-anchor="end" letter-spacing="0">qwen3.6:35b</text>
<text x="410" y="508" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#898781" font-weight="normal" text-anchor="end" letter-spacing="0">large tier only</text>
<path d="M 430 462 L 878.0217391304348 462 Q 882.0217391304348 462 882.0217391304348 466 L 882.0217391304348 506 Q 882.0217391304348 510 878.0217391304348 510 L 430 510 Z" fill="#eb6834" fill-opacity="1.0" />
<text x="864.0217391304348" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="end" letter-spacing="0">23.9 GB</text>
<text x="900.0217391304348" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#d03b3b" font-weight="bold" text-anchor="start" letter-spacing="0">exceeds the ceiling</text>
<text x="410" y="570" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#0b0b0b" font-weight="bold" text-anchor="end" letter-spacing="0">gemma4:31b  +  qwen3.6:35b</text>
<text x="410" y="596" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#898781" font-weight="normal" text-anchor="end" letter-spacing="0">both resident at once</text>
<path d="M 430 550 L 1254.391304347826 550 Q 1258.391304347826 550 1258.391304347826 554 L 1258.391304347826 594 Q 1258.391304347826 598 1254.391304347826 598 L 430 598 Z" fill="#d03b3b" fill-opacity="1.0" />
<text x="1240.391304347826" y="582" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="end" letter-spacing="0">43.8 GB</text>
<text x="1276.391304347826" y="582" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#d03b3b" font-weight="bold" text-anchor="start" letter-spacing="0">exceeds the ceiling</text>
<rect x="96" y="700" width="1408" height="110" rx="10" fill="#eb6834" fill-opacity="0.09"/>
<text x="122" y="736" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#0b0b0b" font-weight="bold" text-anchor="start" letter-spacing="0">Consequence: the two big models can never be co-resident</text>
<text x="122" y="768" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">Every multi-model run is load → infer → evict → load. That is why a run takes minutes rather than seconds, why the large tier is batch-only,</text>
<text x="122" y="794" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">and why a fixed seed does not reproduce across stages - every eviction is a cold load, and a cold load breaks byte-identical output.</text>

<text x="72" y="830" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">macOS caps wired GPU memory at ~75% of RAM. qwen3.6:35b alone (23.9 GB) already exceeds the usable limit and needs sudo sysctl iogpu.wired_limit_mb=28672. Measured for</text>
<text x="72" y="852" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">gemma4:31b: ~11 s model load, ~62 tok/s prompt eval, ~9.5 tok/s generation.</text>
</svg>