<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#2a78d6" fill-opacity="0.22"/>
  <line x1="0" y1="0" x2="0" y2="8" stroke="#2a78d6" stroke-width="3"/>
</pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#898781"/>
</marker>
<marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/>
</marker>

</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="72" y="76" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#0b0b0b" font-weight="bold" text-anchor="start" letter-spacing="0">The novel metric: alarmism before vs after moderation</text>
<text x="72" y="116" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">Two runs, mid tier  ·  llama3.1:8b generator, gemma4:31b moderator  ·  after the 2026-08-10 metric refit</text>
<line x1="72" y1="140" x2="1528" y2="140" stroke="#e1e0d9" stroke-width="2"/>
<line x1="320.0" y1="238" x2="320.0" y2="600" stroke="#e1e0d9" stroke-width="1"/>
<text x="320.0" y="638" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#898781" font-weight="bold" text-anchor="middle" letter-spacing="0">1</text>
<line x1="530.0" y1="238" x2="530.0" y2="600" stroke="#e1e0d9" stroke-width="1"/>
<text x="530.0" y="638" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#898781" font-weight="bold" text-anchor="middle" letter-spacing="0">2</text>
<line x1="740.0" y1="238" x2="740.0" y2="600" stroke="#e1e0d9" stroke-width="1"/>
<text x="740.0" y="638" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#898781" font-weight="bold" text-anchor="middle" letter-spacing="0">3</text>
<line x1="950.0" y1="238" x2="950.0" y2="600" stroke="#e1e0d9" stroke-width="1"/>
<text x="950.0" y="638" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#898781" font-weight="bold" text-anchor="middle" letter-spacing="0">4</text>
<line x1="1160.0" y1="238" x2="1160.0" y2="600" stroke="#e1e0d9" stroke-width="1"/>
<text x="1160.0" y="638" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#898781" font-weight="bold" text-anchor="middle" letter-spacing="0">5</text>
<text x="320.0" y="670" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#898781" font-weight="normal" text-anchor="middle" letter-spacing="0">flat — hides the stakes</text>
<text x="1160.0" y="670" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#898781" font-weight="normal" text-anchor="middle" letter-spacing="0">manipulative catastrophising</text>
<text x="740.0" y="670" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#898781" font-weight="normal" text-anchor="middle" letter-spacing="0">alarmism rating (1–5, half-point scale)</text>
<text x="110" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25" fill="#0b0b0b" font-weight="bold" text-anchor="start" letter-spacing="0">pertussis-global</text>
<text x="110" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">rising series</text>
<text x="110" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">10 emotive spans · 1 flagged claim</text>
<line x1="845.0" y1="330" x2="758.0" y2="330" stroke="#2a78d6" stroke-width="5" marker-end="url(#arrowblue)"/>
<circle cx="845.0" cy="330" r="14" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<circle cx="740.0" cy="330" r="14" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="845.0" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#eb6834" font-weight="bold" text-anchor="middle" letter-spacing="0">3.5</text>
<text x="740.0" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#2a78d6" font-weight="bold" text-anchor="middle" letter-spacing="0">3.0</text>
<text x="899.0" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#2a78d6" font-weight="bold" text-anchor="start" letter-spacing="0">Δ −0.5   first non-zero delta in the project</text>
<text x="110" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25" fill="#0b0b0b" font-weight="bold" text-anchor="start" letter-spacing="0">measles</text>
<text x="110" y="514" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">falling series</text>
<text x="110" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">8 emotive spans · 3 flagged claims</text>
<circle cx="530.0" cy="490" r="27" fill="none" stroke="#898781" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="530.0" cy="490" r="14" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<circle cx="530.0" cy="490" r="9" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="530.0" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#0b0b0b" font-weight="bold" text-anchor="middle" letter-spacing="0">2.0</text>
<text x="580.0" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#898781" font-weight="bold" text-anchor="start" letter-spacing="0">Δ 0.0  —  no change</text>
<circle cx="330" cy="192" r="10" fill="#eb6834"/>
<text x="348" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">raw story (llama3.1:8b)</text>
<circle cx="660" cy="192" r="10" fill="#2a78d6"/>
<text x="678" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">after tone moderation (gemma4:31b)</text>
<rect x="110" y="702" width="1380" height="106" rx="10" fill="#2a78d6" fill-opacity="0.07"/>
<text x="136" y="736" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#2a78d6" font-weight="bold" text-anchor="start" letter-spacing="0">The headroom effect</text>
<text x="136" y="768" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">The moderator can only remove alarmism the generator actually produced. On the falling series it wrote a calm story</text>
<text x="136" y="794" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#52514e" font-weight="normal" text-anchor="start" letter-spacing="0">unprompted — and moderation still rewrote 8 spans while moving the rating by nothing. The rising series gave it work to do.</text>

<text x="72" y="830" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">n = 2 runs — these verify the instrument on real data; they are not yet a result. The judge is currently the same model as the moderator (gemma4:31b), so these deltas</text>
<text x="72" y="852" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#898781" font-weight="normal" text-anchor="start" letter-spacing="0">are self-assessed; an independent judge is protocol item P0.1 and is not yet satisfied.</text>
</svg>